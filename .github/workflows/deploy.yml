name: Deploy - Desplegar en Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Desplegar en producción
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar despliegue
        run: |
          echo "Código subido a main"
          echo "Railway detectará el push y redesplegará automáticamente"
          echo "Verificar el estado en: https://railway.app"
        
