<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de tareas</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet"></head>
<body>
    <header>
        <button id="menu-toggle" tabindex="0" role="button" aria-label="Abrir menú lateral">☰</button>
        <h1>Gestor de tareas</h1>
        <div class="user-info">
            <span id="user-name"></span>
            <button id="logout-btn" aria-label="Cerrar sesión">Salir</button>
        </div>
    </header>

    <aside id="sidebar">
        <nav>
        <div id="task-form-menu">
            <h2>Formulario</h2>
            <form id="taskForm-menu" class="task-form">
                <fieldset>
                    <legend>Nueva Tarea</legend>

                    <label for= "title">Título: </label>
                    <input type="text" class="title" name ="title" required>

                    <label for="description">Descripción: </label>
                    <textarea name="description" class="description" maxlength="140"></textarea>
                    <label for="priority">Prioridad: </label>
                    <select class="priority" name="priority">
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                    </select>

                    <label for="category-input">Categorías</label>
                    <input type="text" 
                    class="category-input" name="category-input"
                    placeholder="Escribe una categoría y pulsa Enter">

                    <select multiple size="2" name="categories" class="categories"></select>

                    <label for="date">Fecha límite: </label>
                    <input type="date" name="date" class="date">

                    <button type="submit">Agregar tarea</button>
                </fieldset>
            </form>
        </div>

        <hr>

        <div id="task-filters-menu">
            <h2>Filtros</h2>
            <button type="button" data-filter="TODAS">Todas</button>
            <button type="button" data-filter="COMPLETAS">Completas</button>
            <button type="button" data-filter="INCOMPLETAS">Incompletas</button>
        </div>

        </nav>
    </aside>

    <main>
        <section id="admin-panel" style="display:none;" aria-label="Panel de administración para usuarios con rol ADMIN">
        </section>
        <section id="task-form">
            <h2>Formulario</h2>
            <form id="taskForm2" class="task-form">
                <fieldset>
                    <legend>Nueva Tarea</legend>

                    <label for= "title">Título: </label>
                    <input type="text" class="title" name ="title" required>

                    <label for="description">Descripción: </label>
                    <textarea name="description" class="description" maxlength="140"></textarea>
                    <label for="priority">Prioridad: </label>
                    <select class="priority" name="priority">
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                    </select>

                    <label for="category-input">Categorías</label>
                    <input type="text" 
                    id="category-input" class="category-input" name="category-input"
                    placeholder="Escribe una categoría y pulsa Enter">

                    <select multiple size="2" name="categories" class="categories"></select>

                    <label for="date">Fecha límite: </label>
                    <input type="date" name="date" class="date">

                    <button type="submit" aria-label="Botón para agregar una nueva tarea">Agregar tarea</button>
                </fieldset>
            </form>
        </section>

        <section id="task-filters">
            <h2>Filtros</h2>
            <div class="filter-container">
                <button type="button" data-filter="TODAS" class="filter-btn active">Todas</button>
                <button type="button" data-filter="COMPLETAS" class="filter-btn">Completadas</button>
                <button type="button" data-filter="INCOMPLETAS" class="filter-btn">Pendientes</button>
            </div>

            <div class="advanced-filters">
                <div class="filter-group">
                    <label for="titleSearch">Buscar</label>
                    <input type="text"
                        class="titleSearch"
                        id="titleSearch"
                        placeholder="Título o descripción..."
                        aria-label="Buscar tareas por texto">
                </div>

                <div class="filter-group">
                    <label for="priority-filter">Prioridad</label>
                    <select id="priority-filter" aria-label="Filtrar por prioridad">
                        <option value="">Todas</option>
                        <option value="ALTA">Alta</option>
                        <option value="MEDIA">Media</option>
                        <option value="BAJA">Baja</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="category-filter">Categoría</label>
                    <select id="category-filter" aria-label="Filtrar por categoría">
                        <option value="">Todas</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="due-before">Antes de</label>
                    <input type="date"
                        id="due-before"
                        aria-label="Fecha límite máxima">
                </div>

                <div class="filter-group">
                    <label for="due-after">Después de</label>
                    <input type="date"
                        id="due-after"
                        aria-label="Fecha límite mínima">
                </div>

                <div class="filter-group filter-group-checkbox">
                    <label for="overdue-filter">
                        <input type="checkbox"
                            id="overdue-filter"
                            aria-label="Mostrar solo tareas vencidas">
                        Solo vencidas
                    </label>
                </div>
            </div>

            <div id="active-filters" aria-live="polite" aria-label="Filtros activos"></div>

            <div id="sort-controls" aria-label="Ordenación"></div>
        </section>

        <section id="task-list">
            <div id="sort-controls" aria-label="Controles de ordenación">
            </div>
            <h2>Lista de tareas</h2>
            <div id="taskContainer">
            </div>

            <nav id="pagination" aria-label="Paginación de tareas">
            </nav>
        </section>

    </main>

    <footer>
        <div class="footer-content">
        <p id="counter">Total de tareas: 0</p>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
            <span class="progress-text" id="progress-text">0% completado</span> 
        </div>
        </div>
    </footer>
    <script src="js/session.js"></script>
    <script>
        (function() {
            if (!getToken() || isSessionExpired()) {
                clearSession();
                window.location.href = 'auth.html';
            }
        })();
    </script>
    <script src="js/data.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
